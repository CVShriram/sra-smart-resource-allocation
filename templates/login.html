<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SRA | Sign in</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body class="login-page"><div class="login-card"><div class="brand"><div class="brandmark">S</div><div><b>SRA</b><small>Resource Intelligence</small></div></div><h1>Welcome back</h1><p>Sign in to the Smart Resource Allocation Platform.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="flash {{c}}">{{m}}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><input type="hidden" name="next" value="{{ request.args.get('next','') }}"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="btn" type="submit">Sign in</button></form><div class="login-note">Use the administrator credentials configured for this installation.</div></div></body></html>
