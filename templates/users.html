{% extends 'base.html' %}{% block heading %}User Management{% endblock %}{% block content %}<p class="sub">Create and review accounts that can access the SRA application.</p><section class="panel formpanel"><h2>Create User</h2><form method="post" class="formgrid"><input type="text" name="username" placeholder="Username" minlength="3" required><input type="password" name="password" placeholder="Password (8+ characters)" minlength="8" required><select name="role"><option value="user">User</option><option value="admin">Admin</option></select><button class="btn" type="submit">Create User</button></form></section><section class="panel"><h2>Accounts</h2><table><tr><th>ID</th><th>Username</th><th>Role</th><th>Created</th></tr>{% for u in users %}<tr><td>{{u[0]}}</td><td><b>{{u[1]}}</b></td><td>{{u[2]|upper}}</td><td>{{u[3]}}</td></tr>{% endfor %}</table></section>{% endblock %}
